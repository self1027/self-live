appId: com.selflive.desktop
productName: Self Live
artifactName: Self-Live-${version}-${arch}.${ext}
directories:
  output: dist
files:
  - src/**/*
  - assets/**/*
  - package.json
extraResources:
  - from: native/bin/app-audio.exe
    to: audio/app-audio.exe
  - from: native/bin/gpu-priority.exe
    to: gpu-priority/gpu-priority.exe
  - from: native/bin/capture-state.exe
    to: capture-state/capture-state.exe
win:
  target: msi
msi:
  perMachine: false
